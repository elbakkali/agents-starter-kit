name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Blocking: secrets in shipped code must fail CI.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog (verified secrets)
        uses: trufflesecurity/trufflehog@v3.88.23
        with:
          extra_args: --only-verified

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      # Blocking on PRs: new/changed dependencies with known vulnerabilities fail the build.
      - uses: actions/dependency-review-action@v4

  shipped-code-security:
    name: Shipped code security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - uses: shivammathur/setup-php@v2
        if: hashFiles('api/composer.json') != ''
        with:
          php-version: "8.2"
          tools: composer

      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: "20"

      - name: Install web dependencies
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci

      - name: Security check (audits + anti-patterns)
        run: python3 -m scripts.tasks.security_check

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
