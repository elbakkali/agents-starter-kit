# Production overlay. Run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# See docs/technical/setup-production.md for full deployment steps.

services:
  api:
    build:
      target: prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    restart: unless-stopped

  web:
    build:
      target: prod
    restart: unless-stopped

  nginx:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  mailpit:
    profiles:
      - disabled
